<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Not the Same Sun — Prototype</title>
		<link rel="stylesheet" type="text/css" href="/project-content/not-the-same-sun/style.css" />
	</head>
	<body class="no-select">
		<svg
			id="scene"
			viewBox="0 0 1920 1080"
			preserveAspectRatio="xMidYMid slice"
			xmlns="http://www.w3.org/2000/svg"
		>
			<defs>
				<linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
					<stop id="skyTop" offset="0.3" stop-color="#000" />
					<stop id="skyHorizon" offset="0.8" stop-color="#000" />
				</linearGradient>
				<!-- The stream only shows where there is ground, so it starts exactly at the horizon -->
				<clipPath id="groundClip"><use href="#ground" /></clipPath>
			</defs>

			<rect id="sky" width="1920" height="1080" fill="url(#skyGradient)" />
			<circle id="sun" cx="0" cy="1300" r="100" fill="#FF8800" />
			<path id="ground" fill="#000" />
			<path id="stream" fill="#000" clip-path="url(#groundClip)" />
			<path
				id="ridgeLight"
				fill="none"
				stroke="#ffb347"
				stroke-width="4"
				stroke-opacity="0"
				stroke-linejoin="round"
			/>
			<g id="houses"></g>
		</svg>
		<script src="/project-content/not-the-same-sun/script.js"></script>
	</body>
</html>
